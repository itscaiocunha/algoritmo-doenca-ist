# Pipeline de dados de ISTs
#
#   gerador-dados ──► data/dados_ist_realistas.csv
#                         │
#   analise-dados (R) ────┴─► data/dados_ist_tratados.csv ──► bigdata (PySpark) ──► bigdata_output/
#                         └─► PostgreSQL ──► Grafana
#
# Cada etapa só inicia depois que a anterior termina com sucesso, então
# `docker compose up` executa o pipeline inteiro na ordem correta.
#
# Credenciais e portas podem ser sobrescritas via `.env` (veja `.env.example`).

x-postgres-credenciais: &postgres-credenciais
  POSTGRES_USER: ${POSTGRES_USER:-admin_ist}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-istunifeob}
  POSTGRES_DB: ${POSTGRES_DB:-ist_db}

services:
  # --- Etapas do pipeline ---------------------------------------------------

  gerador-dados:
    container_name: gerador
    build: ./services/gerador_dados
    volumes:
      - "./data:/data"

  analise-dados:
    container_name: analise
    build: ./services/analise_r
    environment:
      <<: *postgres-credenciais
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - "./data:/data"
    depends_on:
      gerador-dados:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  bigdata:
    container_name: bigdata
    build: ./services/bigdata
    volumes:
      - ./data:/app/data
      - ./bigdata_output:/app/output
    depends_on:
      analise-dados:
        condition: service_completed_successfully

  # --- Infraestrutura -------------------------------------------------------

  postgres:
    container_name: postgres
    image: postgres:15
    environment:
      <<: *postgres-credenciais
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - postgres
    environment:
      <<: *postgres-credenciais
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_LOG_LEVEL: debug

  jenkins:
    build: ./infra/jenkins
    container_name: jenkins
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    restart: unless-stopped

volumes:
  pgdata:
  grafana-data:
  jenkins_home:
